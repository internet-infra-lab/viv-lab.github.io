# 部署实验室官网（viv-lab）到 GitHub Pages（Actions 自动构建，无需手动上传构建产物）
#
# 触发方式：
#   - push 到默认分支（main / master 任一）；
#   - 手动触发（仓库 Actions 页面 → Run workflow）。
#
# 命名约定（viv-lab）：
#   - 网站页面品牌保持「互联网基础技术实验室 / ICT Lab for Infrastructure」不变；
#   - GitHub 仓库名 / 部署标识统一使用 viv-lab（不使用 ict-lab 作为部署标识），
#     仓库名建议：viv-lab 或 viv-lab-website（详见 docs/deploy-github-pages.md）；
#   - 若账号/组织名为 viv-lab 且仓库名为 viv-lab.github.io（用户/组织站点约定），
#     则站点恰好部署在根路径 https://viv-lab.github.io/。
#
# 说明：
#   - 构建在 frontend/ 子目录进行（工作区根目录即仓库根目录，见 docs/deploy-github-pages.md）；
#   - 构建产物自动生成 404.html（SPA 路由刷新兜底）与 .nojekyll，随产物一起发布；
#   - base 路径（BASE_PATH）由仓库名动态推导，仓库内不写死任何 github.io 地址：
#       · 普通仓库  <owner>/viv-lab          → 部署在 https://<owner>.github.io/viv-lab/
#       · 用户站点  viv-lab/viv-lab.github.io → 部署在 https://viv-lab.github.io/（根路径）
#     未来迁移到 viv.cn 二级域名时，将 BASE_PATH 固定为 "/" 即可（见部署文档）。

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - $default-branch
  workflow_dispatch:

# 赋予 GITHUB_TOKEN 部署到 GitHub Pages 的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只允许一个部署在跑；新的 push 会取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ---- 构建并上传产物 ----
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          # 项目站点部署在 /<repo>/ 子路径；仓库名形如 <owner>.github.io 时部署在根路径 "/"
          BASE_PATH: ${{ github.event.repository.name == format('{0}.github.io', github.repository_owner) && '/' || format('/{0}/', github.event.repository.name) }}
        run: npm run build

      - name: Prepare static site (SPA fallback + nojekyll)
        working-directory: frontend
        run: |
          # GitHub Pages 对不存在的路径返回 404.html：拷贝 index.html 作为
          # SPA 路由兜底，保证 /news/1 等深层路由刷新时仍能加载应用并渲染对应页面
          cp dist/index.html dist/404.html
          # 跳过 Jekyll 处理，保证静态资源原样发布
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 上传构建产物目录（dist）
          path: frontend/dist

  # ---- 发布到 GitHub Pages ----
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
