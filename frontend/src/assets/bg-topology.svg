<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480" fill="none">
  <!-- 轻量数据网络拓扑环境纹理（无缝平铺，低透明度蓝灰，仅作背景装饰） -->
  <!-- 网络连线 -->
  <g stroke="rgba(128,153,192,0.13)" stroke-width="1">
    <path d="M60 80 L220 48 L330 140 L430 96"/>
    <path d="M220 48 L250 210 L120 280 L60 80"/>
    <path d="M330 140 L380 300 L430 96"/>
    <path d="M250 210 L360 380"/>
    <path d="M380 300 L220 430"/>
    <path d="M120 280 L150 420"/>
    <path d="M60 300 L180 350"/>
  </g>
  <!-- 节点 -->
  <g fill="rgba(120,148,190,0.16)">
    <circle cx="60" cy="80" r="3"/>
    <circle cx="220" cy="48" r="3"/>
    <circle cx="330" cy="140" r="3.5"/>
    <circle cx="430" cy="96" r="3"/>
    <circle cx="250" cy="210" r="3"/>
    <circle cx="120" cy="280" r="3"/>
    <circle cx="380" cy="300" r="3"/>
    <circle cx="360" cy="380" r="2.5"/>
    <circle cx="220" cy="430" r="2.5"/>
    <circle cx="150" cy="420" r="2.5"/>
    <circle cx="60" cy="300" r="2.5"/>
    <circle cx="180" cy="350" r="2.5"/>
  </g>
  <!-- 工程图纸圆环点缀（虚线，克制） -->
  <g stroke="rgba(128,153,192,0.10)" stroke-width="1" fill="none">
    <circle cx="430" cy="96" r="14" stroke-dasharray="3 5"/>
    <circle cx="120" cy="280" r="18" stroke-dasharray="2 6"/>
  </g>
</svg>
