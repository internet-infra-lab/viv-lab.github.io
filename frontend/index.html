<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="互联网基础技术实验室（ICT Lab for Infrastructure）官方主页：研究方向、团队成员、学术论文与新闻动态。"
    />
    <!-- 站点内资源统一使用 %BASE_URL% 前缀：部署到子路径（GitHub Pages /<repo>/）
         时由 Vite 在构建期自动替换为 base；部署到根路径（viv.cn）时为 "/"，不影响线上地址 -->
    <link rel="icon" type="image/x-icon" href="%BASE_URL%favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <title>互联网基础技术实验室 | ICT Lab for Infrastructure</title>
    <!-- 衬线标题 + 黑体正文（学术官网字体组合）；非阻塞加载，离线/慢网络自动回退系统字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700;900&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700;900&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
